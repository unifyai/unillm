# Dependabot configuration for unifyai/unillm. Version and security updates
# both open against main.

version: 2
updates:
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  groups:
    uv-minor-patch:
      update-types:
      - "minor"
      - "patch"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  - "github-actions"
  commit-message:
    prefix: "chore(actions)"
    include: "scope"
  groups:
    actions-minor-patch:
      update-types:
      - "minor"
      - "patch"
