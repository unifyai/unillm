# CI for unillm
#
# Two modes:
#   Internal (CI_CLONE_APP_PRIVATE_KEY, GCP_SERVICE_ACCOUNT_JSON and UNIFY_KEY
#     all available): Clones Orchestra, starts a local server, and runs tests
#     against it. Full observability (GCP, OTel, logs).
#   External (any of the above missing): Tests run without a local Orchestra.
#     Credit deduction falls back to the production API (or silently warns if no
#     UNIFY_KEY). External contributors can rely on cached responses; cache refresh
#     needs OPENROUTER_API_KEY and ANTHROPIC_API_KEY in the llm-cache-refresh env.

name: Testing unillm

on:
  # Manual trigger - always runs tests
  workflow_dispatch:

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
    - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
    - '**'

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
    - name: Check if tests should run
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # The staging->main promotion gate lives entirely in
        # pytest-release-gate.yml now (pull_request(main)/workflow_dispatch
        # only), so this workflow no longer special-cases base==main: doing
        # so here would run the suite a second time on every release PR.

        # workflow_dispatch always runs tests
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          echo "Tests triggered by workflow_dispatch"
          exit 0
        fi

        # For push events, check commit message for [run-tests]
        if [[ "$EVENT_NAME" == "push" ]]; then
          if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by commit message containing [run-tests]"
            exit 0
          fi

          # staging/main take direct pushes as a matter of course (see AGENTS.md
          # "commit directly to staging"), untagged -- run the suite on those
          # regardless so an untagged trunk push still gets real feedback. This
          # is independent of the staging->main release gate, which lives
          # entirely in pytest-release-gate.yml and never reads this output.
          if [[ "$REF_NAME" == "staging" || "$REF_NAME" == "main" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by direct push to $REF_NAME"
            exit 0
          fi

          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - commit message does not contain [run-tests]"
          exit 0
        fi

        # For pull_request events, check PR title for [run-tests]
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by PR title containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - PR title does not contain [run-tests]"
          fi
          exit 0
        fi

        # Default: don't run tests
        echo "run_tests=false" >> "$GITHUB_OUTPUT"
        echo "Skipping tests - unknown event type"

  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Format check (locked black)
      run: |
        uv sync --only-group lint --no-install-project --frozen
        uv run --no-sync black --check .

  # The everyday suite, for developer feedback on pushes and non-release PRs.
  # The required "pytest" release-gate context is published entirely by
  # pytest-release-gate.yml, which runs this same job on
  # pull_request(main)/workflow_dispatch only -- never push -- so an ordinary
  # push here can never satisfy that gate with a stale pass.
  pytest-run:
    runs-on: ubuntu-latest-8-cores
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    timeout-minutes: 120
    # Internal-mode secrets are scoped per repo since the SOC2 org-secret
    # tightening (visibility "all" -> "private" cut public repos off from
    # inherited org secrets). Sibling repos hold them in a testing
    # environment (unisdk: unify-testing, unify: unity-testing); this job
    # uses the same shape. Populating GCP_SERVICE_ACCOUNT_JSON and UNIFY_KEY
    # in this repo's unify-testing environment (manually, via GitHub UI --
    # write-only, never in source) is all that is needed to enable internal
    # mode; until then the secrets-check gate below routes the job through
    # external mode.
    environment: unify-testing
    # actions:read lets the cross-branch cache hydrate step list and download
    # the llm-cache-refresh artifact; contents:read is for checkout.
    permissions:
      contents: read
      actions: read
    env:
      LOGS_DIR: ${{ github.workspace }}/logs
    steps:
    - uses: actions/checkout@v4

    # Detect whether the full internal secret set is available (org CI vs
    # external fork). The clone App's key alone is not enough: internal mode
    # also authenticates to GCP and seeds Orchestra, so a repo that has the
    # key but not the other secrets must run in external mode rather than
    # fail at the GCP auth step.
    - name: Check internal secrets
      id: secrets-check
      run: |
        missing=""
        [ -z "$CI_CLONE_APP_PRIVATE_KEY" ] && missing="$missing CI_CLONE_APP_PRIVATE_KEY"
        [ -z "$GCP_SERVICE_ACCOUNT_JSON" ] && missing="$missing GCP_SERVICE_ACCOUNT_JSON"
        [ -z "$UNIFY_KEY" ] && missing="$missing UNIFY_KEY"
        if [ -z "$missing" ]; then
          echo "has_internal=true" >> $GITHUB_OUTPUT
          echo "Running in internal mode (Orchestra + GCP available)"
        else
          echo "has_internal=false" >> $GITHUB_OUTPUT
          echo "Running in external mode (no Orchestra, using production API fallback); missing:$missing"
        fi
      env:
        CI_CLONE_APP_PRIVATE_KEY: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        UNIFY_KEY: ${{ secrets.UNIFY_KEY }}

    # --- Internal-only: Clone and set up Orchestra ---

    # Mints an installation token that can read orchestra and nothing else,
    # then revokes it when the job ends. 4606137 is the unifyai-ci-clone
    # App, which holds Contents: Read only; an App id is not a secret.
    - name: Mint a token that can read orchestra
      id: clone-token
      if: steps.secrets-check.outputs.has_internal == 'true'
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: orchestra

    - name: Clone orchestra repo for local deployment
      if: steps.secrets-check.outputs.has_internal == 'true'
      uses: actions/checkout@v4
      with:
        repository: unifyai/orchestra
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: orchestra
        token: ${{ steps.clone-token.outputs.token }}
        fetch-depth: 1

    - name: Authenticate to Google Cloud
      if: steps.secrets-check.outputs.has_internal == 'true'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    - name: Get orchestra commit SHA
      if: steps.secrets-check.outputs.has_internal == 'true'
      id: orchestra-sha
      run: echo "sha=$(git -C orchestra rev-parse HEAD)" >> $GITHUB_OUTPUT

    # --- Clone unify (needed by all modes for uv sync) ---

    - name: Clone unify repo (public; no token needed)
      run: git clone --depth 1 --branch "${{ github.ref_name == 'main' && 'main' || 'staging' }}" https://github.com/unifyai/unisdk.git unify-sdk

    # --- Common setup ---

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install poetry (for orchestra)
      if: steps.secrets-check.outputs.has_internal == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Cache uv dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Cache poetry dependencies
      if: steps.secrets-check.outputs.has_internal == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-orchestra-${{ steps.orchestra-sha.outputs.sha }}
        restore-keys: |
          poetry-${{ runner.os }}-orchestra-

    # Restore LLM response cache (.cache.ndjson)
    - name: Restore LLM cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    # The Actions cache is branch-scoped: a promotion PR into main runs as
    # pull_request (base=main) and can't restore the staging-scoped cache, so
    # the read-only suite would miss every entry. Artifacts are not
    # branch-scoped, so hydrate the consolidated cache from the latest
    # successful llm-cache-refresh run on the head branch (fallback: staging).
    # This makes the staging->main promotion pytest a meaningful, passable gate.
    - name: Hydrate LLM cache from refresh artifact
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        run_id="$(gh run list --repo "$REPO" --workflow=llm-cache-refresh.yml \
          --status=success --branch "$BRANCH" --limit 1 \
          --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)"
        if [ -z "$run_id" ] && [ "$BRANCH" != "staging" ]; then
          run_id="$(gh run list --repo "$REPO" --workflow=llm-cache-refresh.yml \
            --status=success --branch staging --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)"
        fi
        if [ -n "$run_id" ]; then
          echo "Hydrating LLM cache from llm-cache-refresh run $run_id"
          # gh run download refuses to overwrite an existing file, and the
          # Actions-cache restore above may have already written a (stale,
          # branch-scoped) .cache.ndjson. Download into a temp dir and move it
          # over so the cross-branch artifact always wins.
          tmpdir="$(mktemp -d)"
          if gh run download "$run_id" --repo "$REPO" -n llm-cache-ndjson -D "$tmpdir"; then
            mv -f "$tmpdir/.cache.ndjson" .cache.ndjson
            echo "Hydrated .cache.ndjson from artifact"
          else
            echo "No llm-cache-ndjson artifact on run $run_id; keeping Actions-cache copy"
          fi
          rm -rf "$tmpdir"
        else
          echo "No successful llm-cache-refresh run found; keeping Actions-cache copy"
        fi
        if [ -s .cache.ndjson ]; then
          echo "LLM cache ready: $(wc -l < .cache.ndjson) entries"
        else
          echo "WARNING: no .cache.ndjson present after hydrate step"
        fi

    - name: Configure unify path for CI
      run: sed -i 's|path = "../unisdk"|path = "./unify-sdk"|g' pyproject.toml

    - name: Install unillm deps
      run: uv sync --group dev

    - name: Install orchestra dependencies
      if: steps.secrets-check.outputs.has_internal == 'true'
      run: |
        cd "${{ github.workspace }}/orchestra"
        poetry install --no-interaction

    # --- Logging and Orchestra startup ---

    - name: Setup logging directories
      run: |
        mkdir -p "$LOGS_DIR/unillm"
        mkdir -p "$LOGS_DIR/unisdk"
        mkdir -p "$LOGS_DIR/orchestra"
        mkdir -p "$LOGS_DIR/all"

    - name: Start local orchestra
      if: steps.secrets-check.outputs.has_internal == 'true'
      run: |
        ORCHESTRA_SEED_USER=1 \
        ORCHESTRA_WORKERS=8 \
        ORCHESTRA_LOG_DIR="$LOGS_DIR/orchestra" \
        ORCHESTRA_OTEL_LOG_DIR="$LOGS_DIR/all" \
        ORCHESTRA_GCP_BUCKET_NAME="${{ vars.GCP_BUCKET_LOGS }}" \
        ORCHESTRA_GCP_ASSISTANT_MEDIA_BUCKET_NAME="${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}" \
        ORCHESTRA_GCP_ASSISTANT_CALL_RECORDINGS_BUCKET_NAME="${{ vars.GCP_BUCKET_RECORDINGS }}" \
        GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}" \
        GCP_LOCATION="${{ vars.GCP_LOCATION }}" \
        UNIFY_KEY="${{ secrets.UNIFY_KEY }}" \
        "${{ github.workspace }}/orchestra/scripts/local.sh" start

        echo "ORCHESTRA_URL=http://127.0.0.1:8000/v0" >> $GITHUB_ENV

    # --- Run tests ---

    - name: Run unit tests
      id: pytest
      run: |
        set +e
        uv run pytest --timeout=120 -p no:warnings -vv tests/ 2>&1 | tee pytest_output.txt
        exit_code=${PIPESTATUS[0]}
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

        summary_line=$(grep -E "^=+ .*(passed|failed|error).* in [0-9]+(\.[0-9]+)?s" pytest_output.txt | tail -1)
        if [ -n "$summary_line" ]; then
          passed=$(echo "$summary_line" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+" || echo "0")
          failed=$(echo "$summary_line" | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+" || echo "0")
          skipped=$(echo "$summary_line" | grep -oE "[0-9]+ skipped" | grep -oE "[0-9]+" || echo "0")
          errors=$(echo "$summary_line" | grep -oE "[0-9]+ error" | grep -oE "[0-9]+" || echo "0")
          echo "passed=${passed:-0}" >> $GITHUB_OUTPUT
          echo "failed=${failed:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${skipped:-0}" >> $GITHUB_OUTPUT
          echo "errors=${errors:-0}" >> $GITHUB_OUTPUT
        else
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "skipped=0" >> $GITHUB_OUTPUT
          echo "errors=0" >> $GITHUB_OUTPUT
        fi

        exit $exit_code
      env:
        UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Together BYOK is registered on the OpenRouter workspace; this env is
        # available for local/direct Together use and for BYOK registration scripts.
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Normal CI is read-only: it replays the shared LLM cache and never calls
        # paid provider APIs (a cache miss fails loudly, signalling the cache needs
        # a refresh). The dedicated llm-cache-refresh.yml workflow is the only place
        # that writes the cache.
        UNILLM_CACHE: "read-only"
        UNILLM_CACHE_BACKEND: "local_separate"
        UNILLM_OTEL: "true"
        UNILLM_OTEL_LOG_DIR: ${{ env.LOGS_DIR }}/all
        UNILLM_LOG_DIR: ${{ env.LOGS_DIR }}/unillm
        UNISDK_OTEL: "true"
        UNISDK_OTEL_LOG_DIR: ${{ env.LOGS_DIR }}/all

    # --- Post-test reporting and cleanup ---

    - name: Generate success summary
      if: success()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"
        SKIPPED="${{ steps.pytest.outputs.skipped }}"

        STATS="**${PASSED}** passed"
        [ "$SKIPPED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${SKIPPED}** skipped"

        echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "$STATS — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Generate failure summary
      if: failure()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"
        FAILED="${{ steps.pytest.outputs.failed }}"
        SKIPPED="${{ steps.pytest.outputs.skipped }}"
        ERRORS="${{ steps.pytest.outputs.errors }}"

        STATS="**${PASSED}** passed"
        [ "$FAILED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${FAILED}** failed"
        [ "$ERRORS" -gt 0 ] 2>/dev/null && STATS="$STATS, **${ERRORS}** errors"
        [ "$SKIPPED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${SKIPPED}** skipped"

        echo "## ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "$STATS — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Dump orchestra logs on failure
      if: failure() && steps.secrets-check.outputs.has_internal == 'true'
      run: |
        echo "=== Orchestra Server Logs ==="
        if [ -f /tmp/orchestra-local-server.log ]; then
          cat /tmp/orchestra-local-server.log
          cp /tmp/orchestra-local-server.log "$LOGS_DIR/orchestra/server.log"
        else
          echo "No orchestra log file found"
        fi

    # Upload cache diff artifact (new entries from this run)
    - name: Upload cache artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cache-diff-${{ github.run_id }}
        path: .cache_write.ndjson
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 1

    - name: Prepare logs for upload
      if: always()
      run: |
        echo "=== Preparing logs for upload ==="

        if [ -f /tmp/orchestra-local-server.log ]; then
          cp /tmp/orchestra-local-server.log "$LOGS_DIR/orchestra/server.log"
          echo "✓ Copied orchestra server log"
        fi

        # --- unillm logs ---
        if [ -d "$LOGS_DIR/unillm" ]; then
          file_count=$(find "$LOGS_DIR/unillm" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ unillm logs: $file_count files"
        else
          echo "○ unillm logs: directory not found"
        fi

        # --- unify logs ---
        if [ -d "$LOGS_DIR/unisdk" ]; then
          file_count=$(find "$LOGS_DIR/unisdk" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ unify logs: $file_count files"
        else
          echo "○ unify logs: directory not found"
        fi

        # --- orchestra logs (requires filename sanitization for Windows compatibility) ---
        if [ -d "$LOGS_DIR/orchestra" ]; then
          sanitized=0
          while IFS= read -r -d '' file; do
            newname=$(echo "$file" | tr ':' '_')
            if mv "$file" "$newname" 2>/dev/null; then
              ((sanitized++)) || true
            fi
          done < <(find "$LOGS_DIR/orchestra" -type f -name '*:*' -print0 2>/dev/null || true)

          file_count=$(find "$LOGS_DIR/orchestra" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$sanitized" -gt 0 ]; then
            echo "✓ orchestra logs: $file_count files ($sanitized filenames sanitized)"
          else
            echo "✓ orchestra logs: $file_count files"
          fi
        else
          echo "○ orchestra logs: directory not found"
        fi

        # --- OpenTelemetry traces ---
        if [ -d "$LOGS_DIR/all" ]; then
          file_count=$(find "$LOGS_DIR/all" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ OpenTelemetry traces: $file_count files"
        else
          echo "○ OpenTelemetry traces: directory not found"
        fi

        echo "=== Log preparation complete ==="

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_id }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 90

    - name: Stop local orchestra
      if: always() && steps.secrets-check.outputs.has_internal == 'true'
      run: |
        "${{ github.workspace }}/orchestra/scripts/local.sh" stop || true

  # Cache consolidation job: merges new cache entries and saves to GitHub cache
  cache-consolidation:
    name: Consolidate LLM cache
    runs-on: ubuntu-latest
    needs: [should-run-tests, pytest-run]
    if: always() && needs.should-run-tests.outputs.run_tests == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Restore existing consolidated cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    - name: Download cache artifacts from current run
      uses: actions/download-artifact@v4
      with:
        pattern: cache-diff-*
        path: cache-artifacts

    - name: Consolidate .cache.ndjson files
      id: consolidate
      run: |
        # grep -c prints 0 and exits 1 on an empty file, and prints nothing at
        # all when the file is missing, so neither case may abort the step.
        entries() { local n; n=$(grep -c . "$1" 2>/dev/null || true); echo "${n:-0}"; }
        restored=$(entries .cache.ndjson)
        # Decided here rather than in the step condition so that dying before
        # the comparison leaves the answer at "do not publish".
        echo "publish=false" >> "$GITHUB_OUTPUT"
        python3 .github/scripts/consolidate_cache.py \
          --artifacts-dir cache-artifacts
        touch .cache.ndjson
        merged=$(entries .cache.ndjson)
        if (( merged > restored )); then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Consolidated entry count: $merged (restored $restored)"

    # A run that added nothing must not publish. The entry would be newer than
    # the store it was built from, and restore-keys resolves the shared
    # cache-ndjson- prefix to the most recently created match, so it would
    # shadow that store for every later run.
    - name: Store consolidated cache
      if: steps.consolidate.outputs.publish == 'true'
      uses: actions/cache/save@v6
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Cache check job: verifies cache coverage
  cache-check:
    name: LLM Cache Check
    runs-on: ubuntu-latest
    needs: [should-run-tests, pytest-run]
    # Run after pytest completes (regardless of pass/fail), but not if cancelled or skipped
    if: always() && needs.should-run-tests.outputs.run_tests == 'true' && needs.pytest-run.result != 'cancelled'
    steps:
    - name: Download logs from pytest job
      uses: actions/download-artifact@v4
      with:
        pattern: logs-*
        path: all-logs
        merge-multiple: true

    - name: Check cache statistics
      run: |
        # Count cache hits and misses from unillm logs
        TOTAL_HITS=0
        TOTAL_MISSES=0

        if [ -d "all-logs/unillm" ]; then
          # Count files ending in _hit.txt (cache hits) and _miss.txt (cache misses)
          TOTAL_HITS=$(find all-logs/unillm -name "*_hit.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_MISSES=$(find all-logs/unillm -name "*_miss.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        TOTAL=$((TOTAL_HITS + TOTAL_MISSES))

        echo "=== LLM Cache Statistics ==="
        echo "  Hits:   $TOTAL_HITS"
        echo "  Misses: $TOTAL_MISSES"
        echo "  Total:  $TOTAL"

        # Handle case with no LLM calls
        if [ $TOTAL -eq 0 ]; then
          echo ""
          echo "✅ No LLM calls made - cache check passed"
          echo "## ✅ LLM Cache: No LLM calls" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        HIT_RATE=$(python3 -c "print(f'{$TOTAL_HITS * 100.0 / $TOTAL:.1f}')")
        echo "  Hit Rate: ${HIT_RATE}%"
        echo ""

        # Require 100% cache coverage - fail CI on misses
        if [ $TOTAL_MISSES -gt 0 ]; then
          echo "❌ Cache coverage is not 100% - $TOTAL_MISSES cache misses detected"
          echo ""
          echo "Re-run CI to populate cache, then merge once 100% coverage is achieved."
          echo "## ❌ LLM Cache: ${HIT_RATE}% coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$TOTAL_HITS** hits, **$TOTAL_MISSES** misses" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Re-run CI to populate cache, then merge once 100% coverage is achieved._" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ 100% cache coverage"
        echo "## ✅ LLM Cache: 100% coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**$TOTAL_HITS** cache hits, **0** misses" >> $GITHUB_STEP_SUMMARY
