name: Testing unillm

on: push

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Configure git for private repos
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ secrets.UNIFY_CLONE_TOKEN }}
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Update unify branch to match current branch
      run: |
        TARGET_BRANCH=${{ github.ref_name == 'main' && 'main' || 'staging' }}
        sed -i "s|branch = \"staging\"|branch = \"$TARGET_BRANCH\"|" pyproject.toml
    - name: Install deps
      run: uv sync --group dev
    - name: Run black check
      run: uv run black --check .

  pytest:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 120
    env:
      # Local orchestra configuration
      ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra
      ORCHESTRA_PREFIX: unillm
      # Logging directories (matches unity/unify repo structure)
      LOGS_DIR: ${{ github.workspace }}/logs
      # Orchestra GCP configuration (set by google-github-actions/auth step)
      # ORCHESTRA_VERTEXAI_SERVICE_ACC_JSON is set via GOOGLE_APPLICATION_CREDENTIALS by auth action
      ORCHESTRA_VERTEXAI_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      ORCHESTRA_VERTEXAI_LOCATION: ${{ vars.GCP_LOCATION }}
      # GCP bucket names (passed to orchestra server)
      ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
      ORCHESTRA_GCP_ASSISTANT_IMAGES_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
      ORCHESTRA_GCP_ASSISTANT_RECORDINGS_BUCKET_NAME: ${{ vars.GCP_BUCKET_RECORDINGS }}
    steps:
    - uses: actions/checkout@v4

    - name: Clone orchestra repo for local deployment
      uses: actions/checkout@v4
      with:
        repository: unifyai/orchestra
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: orchestra
        token: ${{ secrets.ORCHESTRA_CLONE_TOKEN }}
        fetch-depth: 1

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    - name: Get orchestra commit SHA
      id: orchestra-sha
      run: echo "sha=$(git -C orchestra rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configure git for private repos
      run: |
        # Allow uv/pip to clone private GitHub repos
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_TOKEN: ${{ secrets.UNIFY_CLONE_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install poetry (for orchestra)
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    # Cache uv dependencies
    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ steps.orchestra-sha.outputs.sha }}
        restore-keys: |
          uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
          uv-${{ runner.os }}-

    # Cache poetry dependencies (for orchestra)
    - name: Cache poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-orchestra-${{ steps.orchestra-sha.outputs.sha }}
        restore-keys: |
          poetry-${{ runner.os }}-orchestra-

    # Restore LLM response cache (.cache.ndjson)
    - name: Restore LLM cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    - name: Update unify branch to match current branch
      run: |
        TARGET_BRANCH=${{ github.ref_name == 'main' && 'main' || 'staging' }}
        sed -i "s|branch = \"staging\"|branch = \"$TARGET_BRANCH\"|" pyproject.toml

    - name: Install unillm deps
      run: uv sync --group dev

    - name: Install orchestra dependencies
      run: |
        cd "$ORCHESTRA_REPO_PATH"
        poetry install --no-interaction

    - name: Setup logging directories
      run: |
        # Create log directories matching unity repo structure
        mkdir -p "$LOGS_DIR/unillm"
        mkdir -p "$LOGS_DIR/unify"
        mkdir -p "$LOGS_DIR/orchestra"
        mkdir -p "$LOGS_DIR/all"
        echo "Created logging directories:"
        echo "  - $LOGS_DIR/unillm/   (unillm LLM I/O logs)"
        echo "  - $LOGS_DIR/unify/    (unify client logs)"
        echo "  - $LOGS_DIR/orchestra/ (orchestra request logs)"
        echo "  - $LOGS_DIR/all/       (OpenTelemetry traces)"

    - name: Start local orchestra
      run: |
        # Start local orchestra with test user seeding, logging, and enough workers for parallel tests
        ORCHESTRA_SEED_USER=1 \
        ORCHESTRA_WORKERS=8 \
        ORCHESTRA_LOG_DIR="$LOGS_DIR/orchestra" \
        ORCHESTRA_OTEL_LOG_DIR="$LOGS_DIR/all" \
        UNIFY_KEY="${{ secrets.UNIFY_API_KEY }}" \
        "$ORCHESTRA_REPO_PATH/scripts/local.sh" start

        # Export the local URL for tests
        echo "UNIFY_BASE_URL=http://127.0.0.1:8000/v0" >> $GITHUB_ENV

    - name: Run unit tests
      id: pytest
      run: |
        set +e
        # Run pytest and capture output for summary extraction
        uv run pytest --timeout=120 -p no:warnings -vv tests/ 2>&1 | tee pytest_output.txt
        exit_code=${PIPESTATUS[0]}
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

        # Extract pass/fail counts from pytest summary line
        # Format: "X passed, Y failed, Z warnings in N.NNs" or "X passed in N.NNs"
        summary_line=$(grep -E "^=+ .*(passed|failed).* in [0-9]+\.[0-9]+s =+$" pytest_output.txt | tail -1)
        if [ -n "$summary_line" ]; then
          passed=$(echo "$summary_line" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+" || echo "0")
          failed=$(echo "$summary_line" | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+" || echo "0")
          echo "passed=${passed:-0}" >> $GITHUB_OUTPUT
          echo "failed=${failed:-0}" >> $GITHUB_OUTPUT
        else
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
        fi

        exit $exit_code
      env:
        # Unify API key (for query logging)
        UNIFY_KEY: ${{ secrets.UNIFY_API_KEY }}
        # LLM provider API keys
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Enable LLM response caching (uses local_separate backend: reads .cache.ndjson, writes .cache_write.ndjson)
        UNILLM_CACHE: "true"
        UNILLM_CACHE_BACKEND: "local_separate"
        # Enable OpenTelemetry tracing for unillm
        UNILLM_OTEL: "true"
        UNILLM_OTEL_LOG_DIR: ${{ env.LOGS_DIR }}/all
        # Enable file-based LLM I/O logging for unillm
        UNILLM_LOG: "true"
        UNILLM_LOG_DIR: ${{ env.LOGS_DIR }}/unillm
        # Enable OpenTelemetry tracing for unify client
        UNIFY_OTEL: "true"
        UNIFY_OTEL_LOG_DIR: ${{ env.LOGS_DIR }}/all

    - name: Generate success summary
      if: success()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"

        echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**${PASSED}** passed — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Generate failure summary
      if: failure()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"
        FAILED="${{ steps.pytest.outputs.failed }}"

        echo "## ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**${PASSED}** passed, **${FAILED}** failed — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Dump orchestra logs on failure
      if: failure()
      run: |
        echo "=== Orchestra Server Logs ==="
        if [ -f /tmp/unillm-local-server.log ]; then
          cat /tmp/unillm-local-server.log
          # Copy server log to logs/orchestra/ for artifact upload
          cp /tmp/unillm-local-server.log "$LOGS_DIR/orchestra/server.log"
        else
          echo "No orchestra log file found"
        fi

    # Upload cache diff artifact (new entries from this run)
    - name: Upload cache artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cache-diff-${{ github.run_id }}
        path: .cache_write.ndjson
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 1

    - name: Prepare logs for upload
      if: always()
      run: |
        echo "=== Preparing logs for upload ==="

        # Copy orchestra server log (always, not just on failure)
        if [ -f /tmp/unillm-local-server.log ]; then
          cp /tmp/unillm-local-server.log "$LOGS_DIR/orchestra/server.log"
          echo "✓ Copied orchestra server log"
        fi

        # --- unillm logs ---
        if [ -d "$LOGS_DIR/unillm" ]; then
          file_count=$(find "$LOGS_DIR/unillm" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ unillm logs: $file_count files"
        else
          echo "○ unillm logs: directory not found"
        fi

        # --- unify logs ---
        if [ -d "$LOGS_DIR/unify" ]; then
          file_count=$(find "$LOGS_DIR/unify" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ unify logs: $file_count files"
        else
          echo "○ unify logs: directory not found"
        fi

        # --- orchestra logs (requires filename sanitization for Windows compatibility) ---
        if [ -d "$LOGS_DIR/orchestra" ]; then
          # Orchestra trace filenames may contain colons from route paths.
          # Colons are invalid in Windows NTFS, so GitHub Actions rejects them.
          sanitized=0
          while IFS= read -r -d '' file; do
            newname=$(echo "$file" | tr ':' '_')
            if mv "$file" "$newname" 2>/dev/null; then
              ((sanitized++)) || true
            fi
          done < <(find "$LOGS_DIR/orchestra" -type f -name '*:*' -print0 2>/dev/null || true)

          file_count=$(find "$LOGS_DIR/orchestra" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$sanitized" -gt 0 ]; then
            echo "✓ orchestra logs: $file_count files ($sanitized filenames sanitized)"
          else
            echo "✓ orchestra logs: $file_count files"
          fi
        else
          echo "○ orchestra logs: directory not found"
        fi

        # --- OpenTelemetry traces ---
        if [ -d "$LOGS_DIR/all" ]; then
          file_count=$(find "$LOGS_DIR/all" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ OpenTelemetry traces: $file_count files"
        else
          echo "○ OpenTelemetry traces: directory not found"
        fi

        echo "=== Log preparation complete ==="

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_id }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 90

    - name: Stop local orchestra
      if: always()
      run: |
        "$ORCHESTRA_REPO_PATH/scripts/local.sh" stop || true

  # Cache consolidation job: merges new cache entries and saves to GitHub cache
  cache-consolidation:
    name: Consolidate LLM cache
    runs-on: ubuntu-latest
    needs: pytest
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Restore existing consolidated cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    - name: Download cache artifacts from current run
      uses: actions/download-artifact@v4
      with:
        pattern: cache-diff-*
        path: cache-artifacts

    - name: Consolidate .cache.ndjson files
      run: |
        python3 .github/scripts/consolidate_cache.py \
          --artifacts-dir cache-artifacts

    - name: Store consolidated cache
      uses: actions/cache/save@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Cache check job: verifies cache coverage
  cache-check:
    name: LLM Cache Check
    runs-on: ubuntu-latest
    needs: pytest
    # Run after pytest completes (regardless of pass/fail), but not if cancelled
    if: always() && needs.pytest.result != 'cancelled'
    steps:
    - name: Download logs from pytest job
      uses: actions/download-artifact@v4
      with:
        pattern: logs-*
        path: all-logs
        merge-multiple: true

    - name: Check cache statistics
      run: |
        # Count cache hits and misses from unillm logs
        TOTAL_HITS=0
        TOTAL_MISSES=0

        if [ -d "all-logs/unillm" ]; then
          # Count files ending in _hit.txt (cache hits) and _miss.txt (cache misses)
          TOTAL_HITS=$(find all-logs/unillm -name "*_hit.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_MISSES=$(find all-logs/unillm -name "*_miss.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        TOTAL=$((TOTAL_HITS + TOTAL_MISSES))

        echo "=== LLM Cache Statistics ==="
        echo "  Hits:   $TOTAL_HITS"
        echo "  Misses: $TOTAL_MISSES"
        echo "  Total:  $TOTAL"

        # Handle case with no LLM calls
        if [ $TOTAL -eq 0 ]; then
          echo ""
          echo "✅ No LLM calls made - cache check passed"
          echo "## ✅ LLM Cache: No LLM calls" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        HIT_RATE=$(python3 -c "print(f'{$TOTAL_HITS * 100.0 / $TOTAL:.1f}')")
        echo "  Hit Rate: ${HIT_RATE}%"
        echo ""

        # Require 100% cache coverage - fail CI on misses
        if [ $TOTAL_MISSES -gt 0 ]; then
          echo "❌ Cache coverage is not 100% - $TOTAL_MISSES cache misses detected"
          echo ""
          echo "Re-run CI to populate cache, then merge once 100% coverage is achieved."
          echo "## ❌ LLM Cache: ${HIT_RATE}% coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$TOTAL_HITS** hits, **$TOTAL_MISSES** misses" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Re-run CI to populate cache, then merge once 100% coverage is achieved._" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ 100% cache coverage"
        echo "## ✅ LLM Cache: 100% coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**$TOTAL_HITS** cache hits, **0** misses" >> $GITHUB_STEP_SUMMARY
