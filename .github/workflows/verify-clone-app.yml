name: Verify the clone App

# Temporary probe. unillm's pytest job takes the external-mode branch because
# its unify-testing environment lacks GCP_SERVICE_ACCOUNT_JSON and UNIFY_KEY,
# so the mint step there never executes and the migration is unproven here.
# This exercises the same credential on its own.
#
# Push-triggered rather than workflow_dispatch: the dispatch API only accepts
# workflows already on the default branch, and this never reaches main.

on:
  push:
    branches: [staging]
    paths:
    - '.github/workflows/verify-clone-app.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - name: Mint a token that can read orchestra
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: orchestra

    - name: The minted token can read orchestra
      uses: actions/checkout@v4
      with:
        repository: unifyai/orchestra
        ref: staging
        path: orchestra
        token: ${{ steps.clone-token.outputs.token }}
        fetch-depth: 1

    - name: Confirm
      run: |
        echo "orchestra HEAD is $(git -C orchestra rev-parse --short HEAD)"
