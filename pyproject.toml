[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unifyai-unillm"
version = "0.1.0"
description = "Lightweight LLM access layer with provider normalization, caching, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Unify", email = "hello@unify.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm==1.82.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "unifyai>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/unifyai/unillm"
Repository = "https://github.com/unifyai/unillm"
Issues = "https://github.com/unifyai/unillm/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "autoflake>=2.3.1",
    "black==26.1.0",
    "pytest-dotenv>=0.5.2",
    "pre-commit>=4.0.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[tool.setuptools.packages.find]
include = ["unillm", "unillm.*"]
