[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unillm"
version = "0.0.0"
description = "Lightweight LLM access layer with provider normalization, caching, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Unify", email = "hello@unify.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-cloud-secret-manager>=2.20.0",
    "jsonschema>=4.25.0",
    "litellm==1.102.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/unifyai/unillm"
Repository = "https://github.com/unifyai/unillm"
Issues = "https://github.com/unifyai/unillm/issues"

[dependency-groups]
# Formatters are the single source of truth for the pinned versions CI and
# pre-commit both run. Keep them here (locked in uv.lock), not duplicated in the
# pre-commit hook.
lint = [
    "black==26.5.1",
    "autoflake>=2.4.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "pytest-dotenv>=0.5.2",
    "pre-commit>=4.6.2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "ruff>=0.16.8",
    {include-group = "lint"},
]

[tool.hatch.build.targets.wheel]
packages = ["unillm"]

[tool.black]
target-version = ["py312"]
