[project]
name = "unillm"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.81.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "unifyai",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "autoflake>=2.3.1",
    "black>=25.9.0",
    "pytest-dotenv>=0.5.2",
    "pre-commit>=4.0.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[tool.setuptools.packages.find]
include = ["unillm", "unillm.*"]

[tool.uv.sources]
unifyai = { path = "../unify", editable = true }
